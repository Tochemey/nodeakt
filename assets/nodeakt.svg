<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="nodeakt">
  <!-- Node.js hexagon holding a supervision tree: a parent actor over two
       children, with a message envelope in flight between the children. -->
  <g transform="translate(70,70)">
    <path d="M0,-52 L45,-26 L45,26 L0,52 L-45,26 L-45,-26 Z"
          fill="none" stroke="#5FA04E" stroke-width="6" stroke-linejoin="round"/>
    <!-- supervision edges -->
    <line x1="0" y1="-22" x2="-21" y2="14" stroke="#5FA04E" stroke-width="2.5" opacity="0.55"/>
    <line x1="0" y1="-22" x2="21" y2="14" stroke="#5FA04E" stroke-width="2.5" opacity="0.55"/>
    <!-- actors: parent supervises the two children -->
    <circle cx="0" cy="-22" r="9" fill="#5FA04E"/>
    <circle cx="-21" cy="14" r="8" fill="#8CC84B"/>
    <circle cx="21" cy="14" r="8" fill="#8CC84B"/>
    <!-- message in flight from one child to the other -->
    <path d="M-13,20 Q0,36 13,20" fill="none" stroke="#8CC84B" stroke-width="2.5"
          stroke-dasharray="4 4" stroke-linecap="round"/>
    <polygon points="15,17.5 13.1,26.2 6.9,21.2" fill="#8CC84B"/>
    <g transform="translate(0,28)">
      <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#5FA04E"/>
      <path d="M-8.5,-5.5 L0,2 L8.5,-5.5" stroke="#ffffff" stroke-width="2" fill="none"
            stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="140" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-1">
    <tspan fill="#8CC84B">node</tspan><tspan fill="#3E863D">akt</tspan>
  </text>
</svg>
