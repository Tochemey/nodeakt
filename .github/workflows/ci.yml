name: ci

# The pipeline always triggers, and a first job decides whether anything
# that follows needs to run: the build jobs are gated on an allowlist of
# code paths, so docs, issue templates, and other non-code files can
# never start a build or publish a nightly. An allowlist cannot rot the
# way a blocklist does when a new non-code file type appears.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer commit cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: filter changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # "code" is true if any of these paths changed.
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'benchmark/**'
              - 'examples/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - 'vitest.config.ts'
              - 'vitest.bench.config.ts'
              - 'biome.json'
              - '.github/workflows/ci.yml'

  quality:
    name: types and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: test (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintained LTS lines (22, 24) plus the current release (26).
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  runtimes:
    name: smoke (${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every example runs straight from TypeScript source, covering the
      # source worker entry and actor registration on this runtime.
      - name: Run examples from source
        run: |
          for main in examples/*/main.ts; do
            echo "::group::$main"
            if [ "${{ matrix.runtime }}" = "bun" ]; then
              bun run "$main"
            else
              deno run -A "$main"
            fi
            echo "::endgroup::"
          done

      # The packed smoke test covers what an npm consumer gets: the dist
      # entry, the packaged worker entry, and resolution by package name.
      - name: Run packaged smoke test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            test/smoke/run.sh bun
          else
            test/smoke/run.sh deno run -A
          fi

  nightly:
    name: nightly release
    # Every green push to main ships a prerelease to npm under the
    # "nightly" dist-tag. The version is stamped inside the workflow run
    # and never committed: base version plus UTC date plus short sha.
    # Changesets play no part here; they belong to the release pipeline.
    # A skipped quality or test job (no code changed) skips this one too.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, quality, test, runtimes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp nightly version
        run: |
          base=$(node -p "require('./package.json').version")
          # The short sha is prefixed with "g" (the git-describe convention)
          # so the identifier is always alphanumeric. An all-digit sha such
          # as 0203847 would otherwise be read as a numeric identifier, which
          # semver forbids from carrying a leading zero, failing the publish.
          version="${base}-nightly.$(date -u +%Y%m%d).g${GITHUB_SHA::7}"
          node -e "const fs = require('node:fs'); const pkg = require('./package.json'); pkg.version = process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');" "$version"
          echo "Publishing \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm under the nightly dist-tag
        run: pnpm publish --tag nightly --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
