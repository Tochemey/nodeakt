name: ci

# The pipeline always triggers, and a first job decides whether anything
# that follows needs to run: the build jobs are gated on an allowlist of
# code paths, so docs, issue templates, and other non-code files can
# never start a build. An allowlist cannot rot the way a blocklist does
# when a new non-code file type appears.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer commit cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: filter changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # "code" is true if any of these paths changed.
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'benchmark/**'
              - 'examples/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - 'vitest.config.ts'
              - 'vitest.bench.config.ts'
              - 'biome.json'
              - '.github/workflows/ci.yml'

  quality:
    name: types and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: test (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintained LTS lines (22, 24) plus the current release (26).
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm coverage

      - name: Run in-process membership smoke
        if: matrix.node == 24
        run: pnpm exec tsx test/smoke/membership.smoke.ts

      # One matrix leg pays the real-time suspicion window. This exercises
      # process death and same-address restart over actual TCP without tripling
      # the roughly 25-second failure-detection cost.
      - name: Run multi-process membership smoke
        if: matrix.node == 24
        run: pnpm exec tsx test/smoke/membership.multiprocess.smoke.ts

      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  runtimes:
    name: smoke (${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every example runs straight from TypeScript source, covering the
      # source worker entry and actor registration on this runtime.
      - name: Run examples from source
        run: |
          for main in examples/*/main.ts; do
            echo "::group::$main"
            if [ "${{ matrix.runtime }}" = "bun" ]; then
              bun run "$main"
            else
              deno run -A "$main"
            fi
            echo "::endgroup::"
          done

      # The packed smoke test covers what an npm consumer gets: the dist
      # entry, the packaged worker entry, and resolution by package name.
      - name: Run packaged smoke test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            test/smoke/run.sh bun
          else
            test/smoke/run.sh deno run -A
          fi

      # Transport, remoting, and membership run straight from source because
      # these internal layers are not all part of the published surface yet.
      - name: Run source network and membership smoke tests
        run: test/smoke/net.sh ${{ matrix.runtime }}
