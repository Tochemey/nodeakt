name: release

# The production release flow is tag-driven and this pipeline is the
# only path that publishes a stable version. Cutting a release is done
# locally: the maintainer bumps the version in package.json, writes the
# matching CHANGELOG.md section, commits that release commit, and pushes
# a matching vX.Y.Z tag. This pipeline never writes to the repository:
# it verifies package.json already matches the tag and refuses to
# continue otherwise, publishes to npm, and creates the GitHub release
# from the changelog. A prerelease tag such as v1.2.0-rc.1 publishes
# under the "next" dist-tag and is marked a prerelease; a plain tag
# becomes "latest", the stable production release.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: types, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  publish:
    name: publish to npm and GitHub
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # contents: write is only for creating the GitHub release below;
      # nothing here commits or pushes to the repository.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the version matches the tag
        # The maintainer bumps package.json and writes the CHANGELOG.md
        # section locally, committing that release before tagging, so both
        # already describe this release. Nothing here writes to the
        # repository. A package.json version that does not match the tag
        # means the release commit was never made, so abort before
        # anything publishes.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")

          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json is at $pkg_version but the tag says $tag_version" >&2
            echo "bump package.json, update CHANGELOG.md, commit the release, then push the tag" >&2
            exit 1
          fi

      - name: Publish to npm
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          pnpm publish --tag "$dist_tag" --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        # Release notes are the CHANGELOG.md section for this version,
        # falling back to generated notes when the section cannot be found.
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac

          awk -v ver="$version" '$0 == "## " ver { grab = 1; next } grab && /^## / { exit } grab { print }' CHANGELOG.md > release-notes.md || true
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}
